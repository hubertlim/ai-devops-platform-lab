# Argo CD Application manifest
# This defines how Argo CD should deploy the AI Platform to Kubernetes.
# Argo CD watches this repo and auto-syncs changes from main branch.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-platform-staging
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ai-devops-platform-lab
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/hubertlim/ai-devops-platform-lab.git
    targetRevision: main
    path: infra/k8s/overlays/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: ai-platform

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 5
