version: 2

# Dependabot configuration
# - Monthly cadence to reduce notification noise
# - Grouped updates batch related packages into single PRs
# - Major version bumps are ignored for stable libs to prevent breaking changes
# - Open PR limits keep the queue manageable

updates:
  # ---------------------------------------------------------------------------
  # Python (backend API)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "python"
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pin major versions for core framework stability
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "uvicorn"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # Node.js (frontend web)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # React major versions require manual migration
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # ESLint v9 requires flat config migration
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript major bumps can break type definitions
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Vitest major bumps occasionally change config API
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # Docker base images
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directories:
      - "/apps/api"
      - "/apps/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Pin major versions of base images to avoid breaking builds
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nginx"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # Terraform
  # ---------------------------------------------------------------------------
  - package-ecosystem: "terraform"
    directory: "/infra/terraform"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "infrastructure"
    groups:
      terraform:
        applies-to: version-updates
        patterns:
          - "*"
