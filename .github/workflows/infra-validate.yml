name: Infrastructure Validation

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-validate.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-validate.yml"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Terraform formatting and validation
  # ---------------------------------------------------------------------------
  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.0
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
        working-directory: infra/terraform

      - name: Initialize Terraform (no backend)
        run: terraform init -backend=false
        working-directory: infra/terraform

      - name: Validate Terraform configuration
        run: terraform validate
        working-directory: infra/terraform

  # ---------------------------------------------------------------------------
  # Static security scanning for IaC
  # ---------------------------------------------------------------------------
  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6e87008f9dd1fe3e34e66aca6c97b4a69f72a7f4 # v4.0.0
        with:
          tflint_version: latest

      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive
        working-directory: infra/terraform

  # ---------------------------------------------------------------------------
  # Kubernetes manifest validation
  # ---------------------------------------------------------------------------
  kubernetes:
    name: Kustomize build & kubeconform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        overlay: [staging, production]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0

      - name: Install kustomize
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.2/kustomize_v5.4.2_linux_amd64.tar.gz" \
            | tar xz
          sudo mv kustomize /usr/local/bin/

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz" \
            | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Build manifests with kustomize
        run: kustomize build infra/k8s/overlays/${{ matrix.overlay }} > /tmp/manifests.yaml

      - name: Validate manifests with kubeconform
        run: |
          kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.29.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/manifests.yaml
