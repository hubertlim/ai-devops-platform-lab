[project]
name = "ai-platform-api"
version = "0.1.0"
description = "AI DevOps Platform Lab - Backend API"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "SIM"]
ignore = ["S104"]  # Binding to all interfaces is intentional in containers

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # assert is expected in test files

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
