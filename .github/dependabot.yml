version: 2

# Dependabot configuration
#
# Goals:
#   1. Keep dependencies fresh for security
#   2. Minimize notification noise
#
# Strategy:
#   - Monthly cadence (not weekly)
#   - All minor and patch updates batched into a single grouped PR per ecosystem
#   - All major version bumps ignored (handled manually when intentional)
#   - Strict per-ecosystem PR limits

updates:
  # ---------------------------------------------------------------------------
  # Python (backend API)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "python"
    groups:
      python-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # Node.js (frontend web)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # Docker base images
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directories:
      - "/apps/api"
      - "/apps/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker-images:
        patterns:
          - "*"
        update-types:
          - "patch"
    ignore:
      # Block all major and minor bumps. Language and base-image minor
      # versions can introduce wheel incompatibilities (e.g. python 3.14
      # lacks prebuilt wheels for pydantic-core). Patch updates are safe.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # ---------------------------------------------------------------------------
  # Terraform
  # ---------------------------------------------------------------------------
  - package-ecosystem: "terraform"
    directory: "/infra/terraform"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "infrastructure"
    groups:
      terraform:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
