name: Bug report
description: Report something that isn't working
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in the sections below.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Run `make up`
        2. POST to `/api/v1/completions` with prompt "..."
        3. See error in logs
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: I expected the API to return a 200 with a completion.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste any relevant log output. Will be formatted as code.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse --short HEAD` or release tag.
      placeholder: e.g. abc1234 or v0.1.0

  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - apps/api (backend)
        - apps/web (frontend)
        - infra/terraform
        - infra/k8s
        - observability
        - CI/CD
        - documentation
        - other

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker version, Node/Python versions if relevant.
      placeholder: |
        - OS: macOS 14.4
        - Docker: 26.0.0
        - Node: 20.12.0
