name: Feature request
description: Suggest a new capability or improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe what you'd like to see and why.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point this feature addresses.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the feature do? How should it work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about and why they're not as good.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      multiple: true
      options:
        - apps/api (backend)
        - apps/web (frontend)
        - infra/terraform
        - infra/k8s
        - observability
        - CI/CD
        - documentation
        - other

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mockups, links, references, anything else.
